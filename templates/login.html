{% extends "base.html" %}
{% block title %}Log In - TVISHA{% endblock %}
{% block content %}
<section style="padding: 4rem 0;">
  <div class="container" style="max-width: 420px;">
    <h2 class="font-display" style="color: var(--deep); margin-bottom: 1.5rem;">Log In</h2>
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username" class="label">Username</label>
        <input type="text" class="input" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="password" class="label">Password</label>
        <input type="password" class="input" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-dark" style="width: 100%;">Log In</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--muted);">Don't have an account? <a href="/signup" style="color: var(--rose);">Sign up</a></p>
  </div>
</section>
{% endblock %}
