{% extends "base.html" %}
{% block title %}Sign Up - TVISHA{% endblock %}
{% block content %}
<section style="padding: 4rem 0;">
  <div class="container" style="max-width: 420px;">
    <h2 class="font-display" style="color: var(--deep); margin-bottom: 1.5rem;">Sign Up</h2>
    <form method="POST" action="/signup">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username" class="label">Username</label>
        <input type="text" class="input" id="username" name="username" required minlength="3">
      </div>
      <div class="field">
        <label for="password" class="label">Password</label>
        <input type="password" class="input" id="password" name="password" required minlength="6">
      </div>
      <div class="field">
        <label for="confirm_password" class="label">Confirm Password</label>
        <input type="password" class="input" id="confirm_password" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-dark" style="width: 100%;">Create Account</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--muted);">Already have an account? <a href="/login" style="color: var(--rose);">Log in</a></p>
  </div>
</section>
{% endblock %}
